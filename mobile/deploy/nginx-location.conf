# Merge into the existing server block only after inspecting its routes/TLS.
# This snippet serves the application at the domain root.
# Do not replace an existing website without choosing a separate hostname.
location / {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 1m;
}
